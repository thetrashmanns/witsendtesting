<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Wit's End Books</title>
        <link rel="shortcut icon" href="assets/logo.jpg"/>
        <link rel="stylesheet" href="styles.css"/>
    </head>
    <body onload="change_nav()">
        <header>
            <div class="logo-container">
                <div id="logo">
                    <span>Wit's End Bookstore</span>
                </div>
            </div>
            <div id="pages">
                <a class="active" href="#">Home</a>
                <a href="./tradein.html">Trade in Your Books</a>
                <a href="./locations.html">Locations</a>
                <a href="./contact.html">Contact Us</a>
            </div>
        </header>
        <main>

        </main>
        <footer></footer>
        <script>
          //Reminder to self: need to send user screen width to the server for PHP pre-processing
          // This is just to get the page styling down
          const header = document.getElementsByName("header")[0]; //There's only one header (barring the existance of browser addons)
          const nav_bar = document.getElementById("pages");
          function change_nav() {
            let width = window.screen.availWidth;
            if (width <= 500) {
              header.innerHTML += `
                <div class="menu_icon" onclick="toggle_menu_icon(this)">
                  <div class="bar-1"></div>
                  <div class="bar-2"></div>
                  <div class="bar-3"></div>
                </div>
              `;
            }
          }

          function toggle_menu_icon(x) {
            x.classList.toggle("change")
          }
        </script>
    </body>
</html>
